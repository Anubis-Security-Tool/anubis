name: win-nsis

# Reusable: called by release.yml; can also be started by hand (workflow_dispatch).
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    env:
      NPM_REGISTRY_URL: https://npm.anubis.locker/
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24.x
    - uses: actions/setup-go@v6
      with:
        go-version: '1.27.3'
        cache-dependency-path: native/windows-host/go.sum
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: 'x64'
    - run: npm config set legacy-peer-deps true
    - run: npm install -g node-gyp
    - run: npm install -g yarn
    - uses: ./.github/actions/release-inputs
    - run: npm ci --legacy-peer-deps
    - run: node src/build/bin/release-source-inputs.js build
    - run: npm run pb
    - name: Verify machine installer contracts (no installation)
      run: node --test src/test/unit-ci/windows-machine-packaging.spec.js src/test/unit-ci/windows-machine-edition.spec.js src/test/unit-ci/windows-installer.spec.js

    - name: Build verified unsigned NSIS installer (signed overlays unsupported)
      shell: bash
      env:
        BUILD_NUMBER: ${{ secrets.BUILD_NUMBER }}
        WORKFLOW_NAME: win-nsis
        CSC_LINK: ${{ secrets.CSC_LINK }}
        CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      run: |
        export ANUBIS_UPDATE_URL="$(node -p "require('./src/common/brand.config').domains.update")"
        if [ -z "$CSC_LINK" ]; then
          echo "::warning::CSC_LINK is not set - Windows build is UNSIGNED"
          unset CSC_LINK CSC_KEY_PASSWORD
          export CSC_IDENTITY_AUTO_DISCOVERY=false
        fi
        node src/build/bin/build-win-nsis

    - name: Verify packaged desktop functionality
      run: npm run test-packaged-windows

    - uses: actions/upload-artifact@v4
      if: ${{ failure() }}
      with:
        name: win-nsis-build-diagnostics
        path: .release-build/nsis-evidence/runtime-inventory.json
        if-no-files-found: warn
        retention-days: 7
    - uses: actions/upload-artifact@v4
      with:
        name: win-nsis
        path: |
          dist/*-installer.exe
          dist/*-installer.exe.blockmap
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      with:
        name: win-nsis-provenance
        path: |
          .release-build/source-provenance.json
          .release-build/nsis-evidence/*.json
        if-no-files-found: error
