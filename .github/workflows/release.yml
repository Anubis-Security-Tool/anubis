name: release

# Manual publication creates its unused version tag only after every gate passes.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this exact commit after all gates pass (creates an unused version tag)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    env:
      NPM_REGISTRY_URL: https://npm.anubis.locker/
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24.x
    - name: Read the source version
      id: version
      run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
    - name: Require an unused version for manual publication
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
      env:
        TAG: ${{ steps.version.outputs.tag }}
      run: |
        if git ls-remote --exit-code origin "refs/tags/$TAG"; then
          echo "::error::Tag $TAG already exists; never move or replace a public tag"
          exit 1
        else
          status=$?
          if [ "$status" -ne 2 ]; then exit "$status"; fi
        fi
    - name: Tag matches package.json version
      if: ${{ startsWith(github.ref, 'refs/tags/v') }}
      env:
        TAG: ${{ github.ref_name }}
      run: |
        ver="$(node -p "require('./package.json').version")"
        if [ "$TAG" != "v$ver" ]; then
          echo "::error::tag $TAG does not match package.json version $ver"
          exit 1
        fi
    - run: npm ci --legacy-peer-deps
    - name: Verify unit regressions before building release artifacts
      run: node --test --test-timeout=45000 src/test/unit-ci/*.spec.js

  protocols-and-source:
    needs: check
    uses: ./.github/workflows/protocol-tests.yml
    with:
      source_suite_smoke: true

  win-nsis:
    needs: check
    uses: ./.github/workflows/win-nsis.yml
    secrets: inherit

  win-portable:
    needs: check
    uses: ./.github/workflows/win-portable.yml
    secrets: inherit

  win-tar:
    needs: check
    uses: ./.github/workflows/win-tar.yml
    secrets: inherit

  linux-deb-tar:
    needs: check
    uses: ./.github/workflows/linux-deb-tar.yml
    secrets: inherit

  mac-x64:
    needs: check
    uses: ./.github/workflows/mac.yml
    secrets: inherit

  mac-arm:
    needs: check
    uses: ./.github/workflows/mac-arm.yml
    secrets: inherit

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    needs: [check, protocols-and-source, win-nsis, win-portable, win-tar, linux-deb-tar, mac-x64, mac-arm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24.x
    - uses: actions/download-artifact@v4
      with:
        path: out
        merge-multiple: true
    - name: Create GitHub release and attach assets
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ needs.check.outputs.tag }}
        TARGET_SHA: ${{ github.sha }}
      run: |
        node services/prepare-release.js out release-assets "${TAG#v}"
        pre=""
        case "$TAG" in *-*) pre="--prerelease" ;; esac
        if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          echo "::error::Release $TAG already exists; do not replace published binaries"; exit 1
        else
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$TARGET_SHA" >/dev/null
          fi
          gh release create "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --target "$TARGET_SHA" --title "$TAG" --generate-notes $pre
        fi

  publish-self-hosted:
    if: ${{ vars.ANUBIS_AUTO_SELF_HOSTED_PUBLISH == 'true' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/publish-self-hosted.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
