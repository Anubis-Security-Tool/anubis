name: protocol-tests

on:
  workflow_call:
    inputs:
      source_suite_smoke:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      source_suite_smoke:
        description: Build a fresh source suite and verify local Web and Sync startup
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/protocol-tests.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/app/server/**'
      - 'src/client/components/sftp/sftp-entry.jsx'
      - 'src/test/unit-ci/session-ftp-renderer.spec.js'
      - 'src/test/unit-ci/web-client-package.spec.js'
      - 'src/build/bin/assemble-web-client.js'
      - 'src/build/web-app/package.json'
      - '.github/workflows/web-client-publish.yml'
      - 'src/build/vite/electerm-entry.js'
      - 'src/build/vite/conf.js'
      - 'src/build/vite/dev-server.js'
      - 'src/test/unit-ci/native-renderer-bootstrap.spec.js'
      - 'src/test/unit-ci/local-terminal-startup.spec.js'
      - 'src/test/unit-ci/fs-shell-lifecycle.spec.js'
      - 'src/app/lib/fs.js'
      - 'src/build/bin/prepare.js'
      - 'src/test/unit-ci/packaging-yarn.spec.js'
      - 'src/app/common/*.mjs'
      - 'src/client/common/*vv*.js'
      - 'src/test/unit-ci/managed-browser*.spec.js'
      - 'src/test/integration/session-loopback-acceptance.spec.js'
      - 'src/test/integration/lib/**'
  pull_request:
    paths:
      - '.github/workflows/protocol-tests.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/app/server/**'
      - 'src/client/components/sftp/sftp-entry.jsx'
      - 'src/test/unit-ci/session-ftp-renderer.spec.js'
      - 'src/test/unit-ci/web-client-package.spec.js'
      - 'src/build/bin/assemble-web-client.js'
      - 'src/build/web-app/package.json'
      - '.github/workflows/web-client-publish.yml'
      - 'src/build/vite/electerm-entry.js'
      - 'src/build/vite/conf.js'
      - 'src/build/vite/dev-server.js'
      - 'src/test/unit-ci/native-renderer-bootstrap.spec.js'
      - 'src/test/unit-ci/local-terminal-startup.spec.js'
      - 'src/test/unit-ci/fs-shell-lifecycle.spec.js'
      - 'src/app/lib/fs.js'
      - 'src/build/bin/prepare.js'
      - 'src/test/unit-ci/packaging-yarn.spec.js'
      - 'src/app/common/*.mjs'
      - 'src/client/common/*vv*.js'
      - 'src/test/unit-ci/managed-browser*.spec.js'
      - 'src/test/integration/session-loopback-acceptance.spec.js'
      - 'src/test/integration/lib/**'

permissions:
  contents: read

jobs:
  source-suite-smoke:
    if: ${{ inputs.source_suite_smoke }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NPM_REGISTRY_URL: https://npm.anubis.locker/
      npm_config_cache: ${{ runner.temp }}/anubis-source-suite-npm-cache
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      ANUBIS_MANAGED_ACCESS: '0'
      ANUBIS_MANAGED_URL: ''
      ANUBIS_SOURCE_SUITE_SMOKE_WORKSPACE: ${{ runner.temp }}/anubis-source-suite
      ANUBIS_SOURCE_SUITE_SMOKE_RECEIPT: ${{ runner.temp }}/anubis-source-suite-smoke.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential libudev-dev
      - name: Install and build the actual fresh source suite
        run: |
          test ! -e node_modules
          test ! -e work
          test ! -e "$ANUBIS_SOURCE_SUITE_SMOKE_WORKSPACE"
          timeout --signal=TERM --kill-after=30s 25m \
            node scripts/source-suite.js install --workspace "$ANUBIS_SOURCE_SUITE_SMOKE_WORKSPACE"
      - name: Verify isolated Web and authenticated non-writing Sync readiness
        run: node src/test/integration/source-suite-smoke.js
      - uses: actions/upload-artifact@v4
        with:
          name: source-suite-smoke
          path: ${{ runner.temp }}/anubis-source-suite-smoke.json
          if-no-files-found: error

  loopback:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      NPM_REGISTRY_URL: https://npm.anubis.locker/
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: npm ci --legacy-peer-deps
      - name: Verify real protocols and managed browser routing
        run: >-
          node --test --test-timeout=45000
          src/test/integration/session-loopback-acceptance.spec.js
          src/test/unit-ci/session-ftp-renderer.spec.js
          src/test/unit-ci/web-client-package.spec.js
          src/test/unit-ci/native-renderer-bootstrap.spec.js
          src/test/unit-ci/local-terminal-startup.spec.js
          src/test/unit-ci/fs-shell-lifecycle.spec.js
          src/test/unit-ci/packaging-yarn.spec.js
          src/test/unit-ci/managed-browser.spec.js
          src/test/unit-ci/managed-browser-rpc.spec.js
          src/test/unit-ci/managed-browser-packaging.spec.js
